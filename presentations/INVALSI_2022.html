---
**Introduction**

Contextual explanantion: inequalities

- Some relevant literature agrees inequality has potential to influence protest, but it is unclear how differ the effect when different types of participation are considered. 

- Additionally, how it's related with protest of young popullation still being a unclear topic.


Individuals explanation of participation
- Resorces Model of participation: unequal access to political voice

- Civic or political knowledge it's considered a cornerstone of political involvement

- Gender differences

---
**Objectives**

This study aims:

- To assess gaps regarding adolescents' willingness to participate in radical and pacific forms of political actions, analyzing the willingness of adolescents to participate in various forms of radical political participation and comparing the differences between countries and over time.

- To evaluate the role of inequality conditions (measured as Gini index) to explain the differences in the dispositions of these forms of political action among countries.

- To evaluate the role of individual characteristics (parent's education, civic knowledge and gender) to explain the differences in the dispositions of these forms of political action among countries.


---
**Data**

- National representative samples using International Civic and Citizenship Study ICCS, 2009 and 2016.

  + ICCS 2009: 38 countries
  + ICCS 2016: 24 countries

- National representative samples using CIVED 1999

  + CIVED 1999: 28 countries
  
- This study pretend to combine the three studies.


---
**Measures of participation available on the three IEA studies**

There are many different ways how citizens may express their opinions about important issues in society. Would you take part in any of the following activities to express your opinion in the future? 

*Disposition to pacific actions*
- Contact al elected representative
- Take part in a peaceful march or rally
- Collect signatures for a petition

*Disposition to radical or disruptive actions*
- Spray-paint protest slogans on walls
- Stage a protest by clocking traffic
- Occpy public buldings as a sign of protest

*Response scale*
    + 1-I would certainly not do this
    + 2-I probably not do this
    + 3-I would probably do this
    + 4-I would certainly do this

---
**Independent Variables measures**

- Gini Index: obtained from the Standadized World Income Inequality Database (https://fsolt.org/swiid/). 

- Parents educational level: the highest level recoded as 0 *Non univerity* and 1 *University*

- Civic knowledge: One plasible value in ICCS 2009 and 2016. In CIVED 1999 were used the provided scale.

- Sex of the student.


---
**Analyses **

A set of descriptive analyses were connducted to undertand patterns

A set o f multilevel models were conducted to estimate the effect of contextual and individual variables

---
**Discussion**

General patterns
- Student are more willing to participate in pacific than in radical actions.
- Both types of willingness tend to increse between 1999, 2009 and 2016.
- Latin American countries tend to be in top of the list in both types of participation.

Unequal context
- In more unequal contexts students tend to show higher disposition to participate in pacific actions. This results appear in 1999, 2009 and 2016.
- For the case of radicala actions, seems to unequal context matter in recent years but less in previuos cohorts.
- This results support the idea that inequalities generate more conflicts inn the society.

---
**Discussion**

Individual characteristics.
- Civic knowledge show a relevant role: tend to increse participation in pacific action and decrese participation in radical actions. 
- Resources matters in two ways: intergenerational transmission of civic skills.
- Gender differences: girls tend to show lower dispositions than boys for radical actions but the differences seems to be shortened across time.

Next steps
- Combine the data: there are some challenges about homologation of Civic Knowledge scale.
